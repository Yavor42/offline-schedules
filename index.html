<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Offline Transit</title>
<style>
:root{--bg:#0e1116;--card:#181d25;--card2:#222935;--tx:#e8ecf2;--mut:#8b95a5;--acc:#4d83ff;--ok:#3ecf8e;--line:#2a313d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden;overscroll-behavior:none;
 font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
header h1 img{display:block;height:44px;width:auto;max-width:100%;object-fit:contain}
header h1{flex:1;margin:0;font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:22px}
.pill{border:0;border-radius:20px;background:var(--card);color:var(--mut);font-size:13px;padding:8px 12px}
main{flex:1;overflow-y:auto;padding:4px 14px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit}
button:active,.row:active{filter:brightness(1.3);transform:scale(.985)}
.hero{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.big{display:flex;align-items:center;gap:16px;width:100%;padding:26px 20px;border:0;border-radius:22px;background:var(--card);text-align:left}
.big .ic{font-size:34px;width:64px;height:64px;border-radius:18px;background:var(--card2);display:grid;place-items:center}
.big b{display:block;font-size:20px}.big span{color:var(--mut);font-size:14px}
.clock{font-size:54px;font-weight:700;margin:14px 0 0;letter-spacing:-1px}.sub{color:var(--mut);margin-bottom:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.badge{display:inline-grid;place-items:center;min-width:46px;height:32px;padding:0 10px;border-radius:9px;font-weight:700;color:#fff;font-size:15px}
.grid .badge{height:56px;font-size:20px;border-radius:14px;border:0}
.row{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;border-radius:16px;background:var(--card);width:100%;border:0;text-align:left}
.row .grow{flex:1;min-width:0}.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}.row .s{color:var(--mut);font-size:13px}
.time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.eta{font-size:13px;color:var(--ok);text-align:right}
.code{color:var(--mut);font-size:12px;background:var(--card2);padding:3px 8px;border-radius:8px}
input[type=search]{width:100%;padding:15px 16px;font-size:17px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);outline:0;-webkit-user-select:text;user-select:text;margin:6px 0 12px}
input[type=search]:focus{border-color:var(--acc)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}input[type=search]{-webkit-appearance:none;padding-right:54px}
.sw{position:relative}.sw input[type=search]{margin:6px 0 12px}#qx{position:absolute;right:4px;top:10px;width:48px;height:48px;border:0;background:none;color:var(--mut);font-size:26px;line-height:1}#qx[hidden]{display:none}
.vp{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);padding:7vh 14px 0}.vpb{max-width:420px;margin:0 auto;max-height:68vh;display:flex;flex-direction:column;background:var(--card2);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.65);overflow:hidden}
.vpb input{margin:10px;width:calc(100% - 20px);padding:13px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);outline:0;-webkit-user-select:text;user-select:text}.vpb input:focus{border-color:var(--acc)}
.vl{overflow-y:auto;padding:0 6px 8px}.vl button{display:block;width:100%;text-align:left;padding:13px 12px;border:0;border-radius:10px;background:none;color:var(--tx);font-size:16px}.vl button.on{background:var(--card);color:var(--acc);font-weight:700}.vl .empty{padding:24px 10px}
.selbtn{margin-left:auto;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px}
.fx{margin:0 -14px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;min-width:54px;padding:0 16px;border-radius:19px;border:1.5px solid transparent;font-weight:700;font-size:15px;color:#fff;background:var(--c)}
.chip.off{background:var(--card);color:var(--mut);border-color:var(--line)}
.advwrap{position:relative;padding:2px 14px 8px;display:flex;gap:12px;align-items:center}
.advbtn{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px}
.advbtn.on{border-color:var(--acc);color:var(--acc)}
.pvbtn{display:block;width:100%;height:38px;margin:2px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mut)}.row.past{opacity:.6}
.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 8px;color:var(--mut)}.pager button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}.pager button:disabled{opacity:.3}
.clr{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline}
.menu{position:absolute;left:14px;top:calc(100% - 4px);width:min(calc(100% - 28px),350px);z-index:6;background:var(--card2);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.65);padding:2px 14px 10px}
.menu h3{margin:12px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.chk{display:flex;align-items:center;gap:12px;min-height:46px}
.chk.dis{opacity:.35;pointer-events:none}
.chk input[type=checkbox]{width:22px;height:22px;margin:0;flex:none;accent-color:var(--acc)}
.chk input[type=time],.chk select{margin-left:auto;max-width:190px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;-webkit-user-select:text;user-select:text}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.hd{background:var(--card);border-radius:22px;padding:18px;margin-top:6px;text-align:center}
.hd .big2{font-size:56px;font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0 2px}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;padding:14px;border:0;border-radius:14px;background:var(--card2);font-weight:600}
.nav button:disabled{opacity:.3}
.nav button{min-width:0}.nav .half{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;min-width:0}.nav.sm{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.nav.sm button{font-size:12px;padding:11px 2px;white-space:nowrap}
.pk{left:0;right:0;width:auto;top:calc(100% + 6px);max-height:46vh;overflow-y:auto;overscroll-behavior:contain;text-align:left;padding-bottom:12px}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tb{padding:11px 0;border:0;border-radius:10px;background:var(--card);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.tb.past{opacity:.4}.tb.cur{background:var(--acc);color:#fff;opacity:1}
.st{display:flex;gap:14px;padding:11px 4px;position:relative;align-items:center;border:0;background:none;width:100%;text-align:left}
.st .tm{width:52px;font-variant-numeric:tabular-nums;font-weight:600}
.st .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;z-index:1}
.st::before{content:"";position:absolute;left:76px;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--c);opacity:.5}
.st:first-child::before{top:50%}.st:last-child::before{bottom:50%}
.st.past{opacity:.38}.st .nm{flex:1}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
main.fill{padding:0;overflow:hidden}
#map{width:100%;height:100%;background:#0b0e13;touch-action:none;outline:0}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--card2);color:var(--tx);border-color:var(--line)}
.leaflet-bar{border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.leaflet-map-pane,.leaflet-tile-pane{will-change:transform}
.leaflet-bottom{margin-bottom:env(safe-area-inset-bottom)}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);padding:30px;z-index:500}
</style>
</head>
<body>
<div id="app"><header><button class="back" id="bk" hidden>‹</button><h1 id="ttl"></h1><button class="pill" id="dt"></button></header><main id="main"></main></div>
<script src="lib/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s),main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{m=(m%1440+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const now=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
let lines=[],stations={},by={},q='';const missing=new Set();
let mode='auto';try{mode=localStorage.dayMode||'auto'}catch(e){}
const dayType=(o=0)=>{if(mode!=='auto')return mode;const d=new Date();d.setDate(d.getDate()+o);return[0,6].includes(d.getDay())?'holiday':'workday'};
const sname=id=>stations[id]?.displayName||id.replace(/([a-z])([A-Z])/g,'$1 $2');
const scode=id=>stations[id]?.ID||'';
const badge=l=>`<span class="badge" style="background:${esc(l.color||'#4d83ff')}">${esc(l.displayName||l.id)}</span>`;
const eta=d=>d<=0?'now':d<60?d+' min':Math.floor(d/60)+'h '+pad(d%60)+'m';
const times=(d,o=0)=>d.schedules[dayType(o)]||[];
let dayStart=360;   // earliest departure in the data; filter times before this mean 'after midnight' (next day)
const uw=t=>t<dayStart&&now()>=dayStart?t+1440:t;   // small times = after midnight: tomorrow if it's daytime now, today if it's already past midnight

async function load(){
  const man=await (await fetch('data/manifest.json')).json();
  stations=await (await fetch('data/'+man.stations)).json();
  lines=await Promise.all(man.lines.map(f=>fetch('data/lines/'+f).then(r=>r.json())));
  const norm=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,''),nmap={};
  Object.keys(stations).forEach(k=>nmap[norm(k)]=k);
  lines.forEach(l=>l.directions.forEach(d=>d.stops.forEach(s=>{
    const raw=String(s.stationId).trim();s.stationId=stations[raw]?raw:nmap[norm(raw)]||raw;
    if(!stations[s.stationId])missing.add(s.stationId)})));
  lines.forEach(l=>l.directions.forEach(d=>Object.values(d.schedules).forEach(a=>a.length&&(dayStart=Math.min(dayStart,...a.map(toMin))))));
  lines.forEach(l=>l.directions.forEach(d=>{let c=0;d.cum=d.stops.map(s=>{const v=c;c+=s.offsetMinutes;return v});
    d.stops.forEach((s,i)=>(by[s.stationId]??=[]).push({l,d,i,off:d.cum[i]}))}));
}
// ---- navigation (history-backed so the phone's back gesture works)
const go=s=>{if(s.v==='station')fReset(s.id);history.pushState(s,'');render(s)};
const set=s=>{history.replaceState(s,'');render(s)};
window.onpopstate=e=>render(e.state||{v:'home'});
$('#bk').onclick=()=>history.back();
$('#dt').onclick=()=>{mode={auto:'workday',workday:'holiday',holiday:'auto'}[mode];try{localStorage.dayMode=mode}catch(e){}render(history.state||{v:'home'})};

const V={
home(){
  const d=new Date();
  return{t:'Transit',h:`<div class="clock">${fmt(now())}</div><div class="sub">${d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div>
  <div class="hero"><button class="big" data-go='{"v":"routes"}'><div class="ic">🚎</div><div><b>Search routes</b><span>Browse lines &amp; directions</span></div></button>
  <button class="big" data-go='{"v":"search"}'><div class="ic">📍</div><div><b>Search stations</b><span>By name or ID · upcoming departures</span></div></button>
  <button class="big" data-go='{"v":"map"}'><div class="ic">🗺️</div><div><b>Transit map</b><span>Pan &amp; zoom the network map</span></div></button></div>
  ${missing.size?`<div class="sub" style="margin-top:22px;font-size:12px">⚠ Not in stations file: ${[...missing].map(esc).join(', ')}</div>`:''}`}},
routes(){
  const g={};lines.forEach(l=>(g[l.type]??=[]).push(l));
  const nm={trolleybus:'Trolleybuses',bus:'Buses'};
  const order=['trolleybus','bus',...Object.keys(g).filter(k=>!nm[k])];
  return{t:'Routes',h:order.filter(k=>g[k]).map(k=>`<h2>${nm[k]||esc(k)}</h2><div class="grid">${g[k].map(l=>`<button class="badge" style="background:${esc(l.color)}" data-go='${JSON.stringify({v:'dirs',l:l.id})}'>${esc(l.displayName)}</button>`).join('')}</div>`).join('')||'<div class="empty">No routes found</div>'}},
dirs(s){
  const l=lines.find(x=>x.id===s.l);
  return{t:'Line '+l.displayName,h:`<h2>Choose direction</h2>`+l.directions.map(d=>`<button class="row" data-go='${JSON.stringify({v:'trip',l:l.id,d:d.id})}'>${badge(l)}<div class="grow"><div class="t">➜ ${esc(sname(d.stops.at(-1).stationId))}</div><div class="s">from ${esc(sname(d.stops[0].stationId))} · ${d.stops.length} stops</div></div>›</button>`).join('')}},
trip(s){
  const l=lines.find(x=>x.id===s.l),d=l.directions.find(x=>x.id===s.d),tot=d.cum.at(-1);
  // target = most recently departed trip still running (not yet at terminus), else next upcoming, else last of the day
  const target=(t,n)=>{let k=-1;t.forEach((x,j)=>{const m=toMin(x);if(m<=n&&n<m+tot)k=j});if(k>=0)return{k,act:1};k=t.findIndex(x=>toMin(x)>=n);return{k:k<0?t.length-1:k,act:0}};
  let yd=s.y?1:0,i=s.i;
  if(i==null&&!yd){const yt=times(d,-1),r=target(yt,now()+1440);if(r.act){yd=1;i=r.k}}   // trip from yesterday still running past midnight
  const ts=times(d,-yd),n=now()+yd*1440;
  if(!ts.length)return{t:'Line '+l.displayName,h:`<div class="empty">No ${dayType()} departures for this direction</div>`};
  const one=ts.length===1,tg=target(ts,n);
  if(i==null)i=tg.k;
  if(s.i==null)history.replaceState({...s,i,...(yd?{y:1}:{})},'');
  const dep=toMin(ts[i]),diff=dep-n,last=toMin(ts.at(-1))+d.cum.at(-1);
  const menu=pickOpen&&!one?`<div class="menu pk"><h3>Select departure</h3><div class="tg">${ts.map((t,k)=>`<button class="tb ${k===i?'cur':''} ${toMin(t)<n?'past':''}" data-i="${k}">${t}</button>`).join('')}</div></div>`:'';
  const stat=diff>0?`Departs in ${eta(diff)}`:n>last?'Finished':diff===0?'Departing now':`Departed ${-diff} min ago`;
  const flag=i===ts.length-1&&diff<0?' · last of the day':'';
  return{t:'Line '+l.displayName,h:`<div class="hd">${badge(l)}<div class="sub" style="margin:6px 0 0">➜ ${esc(sname(d.stops.at(-1).stationId))}</div>
  <div class="big2">${ts[i]}</div><div style="color:var(--ok);font-weight:600">${stat}${flag}</div>
  <div class="sub" style="margin:4px 0 0;font-size:13px">${one?'Only one departure today':`Departure ${i+1} of ${ts.length}`} · ${dayType()}</div>
  <div class="nav"><button data-i="${tg.k}" ${one?'disabled':''} style="color:var(--acc)">${tg.act?'Jump to current departure':'Jump to upcoming departure'}</button></div>
  <div class="nav" style="margin-top:10px"><button data-i="${i-1}" ${one||i<1?'disabled':''}>‹ Previous</button><button data-i="${i+1}" ${one||i>=ts.length-1?'disabled':''}>Next ›</button></div>
  <div style="position:relative"><div class="nav sm"><div class="half"><button data-i="0" ${one||i<1?'disabled':''}>⏮ First</button><button data-i="${ts.length-1}" ${one||i>=ts.length-1?'disabled':''}>Last ⏭</button></div><button data-pk ${one?'disabled':''}>Choose a departure… ▾</button></div>${menu}</div></div>
  <h2>Stops</h2><div style="--c:${esc(l.color)}">${d.stops.map((st,k)=>{const m=dep+d.cum[k];
  return`<button class="st ${m<n?'past':''}" data-go='${JSON.stringify({v:'station',id:st.stationId})}'><span class="tm">${fmt(m)}</span><span class="dot"></span><span class="nm">${esc(sname(st.stationId))}${k===d.stops.length-1?'<span class="tag">end</span>':''}</span></button>`}).join('')}</div>`,after(){const m=$('.pk'),c=m&&m.querySelector('.cur');if(c)m.scrollTop=c.offsetTop-m.clientHeight/2+c.offsetHeight/2}}},
map(){return{t:'Transit map',h:'<div id="map"></div>',after:initMap}},
search(){
  return{t:'Stations',h:`<div class="sw"><input id="q" type="search" placeholder="Station name or ID" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(q)}"><button type="button" id="qx" aria-label="Clear" ${q?'':'hidden'}>✕</button></div><div id="res"></div>`,after(){
    const inp=$('#q'),res=$('#res');
    const draw=()=>{q=inp.value;const t=q.trim().toLowerCase();
      let all=Object.entries(stations).map(([id,s])=>({id,name:s.displayName,code:s.ID}));
      Object.keys(by).forEach(id=>{if(!stations[id])all.push({id,name:sname(id),code:''})});
      if(t)all=all.filter(s=>s.name.toLowerCase().includes(t)||s.code===t||s.code.startsWith(t)||s.id.toLowerCase().includes(t));
      all.sort((a,b)=>(a.code===t?-1:b.code===t?1:0)||a.name.localeCompare(b.name));
      res.innerHTML=all.slice(0,60).map(s=>`<button class="row" data-go='${JSON.stringify({v:'station',id:s.id})}'><div class="grow"><div class="t">${esc(s.name)}</div><div class="s">${(by[s.id]||[]).length?[...new Set(by[s.id].map(e=>e.l.displayName))].join(' · '):'No lines'}</div></div>${s.code?`<span class="code">#${esc(s.code)}</span>`:''}</button>`).join('')||'<div class="empty">No stations match</div>'};
    const qx=$('#qx');inp.oninput=()=>{qx.hidden=!inp.value;draw()};qx.onclick=()=>{inp.value='';qx.hidden=true;inp.focus();draw()};draw();}}},
station(s){
  if(F.sid!==s.id)fReset(s.id);
  const head=`<div class="sub" style="margin:4px 4px 0">${scode(s.id)?'Station #'+esc(scode(s.id))+' · ':''}${dayType()} schedule</div><h2>Upcoming departures</h2>`;
  if(!(by[s.id]||[]).length)return{t:sname(s.id),h:head+'<div class="empty">No upcoming departures</div>'};
  return{t:sname(s.id),h:head+'<div class="fx" id="fx"></div><button class="pvbtn" id="pv"></button><div id="pdeps"></div><div id="fdeps"></div>',after(){initFilters(s.id)}}}
};
// ---- station filters (standard = line chips, advanced = vehicle type / time frame / stops-at; the two are mutually exclusive)
let F={},refreshDeps=null,closeFx=null,pickOpen=false;
const PG=15,PV=10,PVMIN=60;   // departures per page; previous departures: max count / max minutes back
const fReset=id=>{F={page:0,prev:false,sid:id,sel:new Set(),types:new Set(),after:null,before:null,via:null,open:false}};
const advCount=()=>F.types.size+(F.after!=null)+(F.before!=null)+(F.via?1:0);
const clearAdv=()=>{F.types.clear();F.after=F.before=F.via=null};
const tm=v=>v?toMin(v):null;
function rowHtml(e,n,past){const term=e.i===e.d.stops.length-1;
  return`<button class="row${past?' past':''}" data-go='${JSON.stringify({v:'trip',l:e.l.id,d:e.d.id,i:e.ti,...(e.y?{y:1}:{})})}'>${badge(e.l)}<div class="grow"><div class="t">${esc(e.d.displayName||sname(e.d.stops.at(-1).stationId))}</div>${term?'<div class="s">Terminates here</div>':''}</div><div><div class="time">${fmt(e.m)}</div><div class="eta">${past?(n-e.m)+' min ago':eta(e.m-n)}</div></div></button>`}
function initFilters(id){
  const ents=by[id],fx=$('#fx'),deps=$('#fdeps');
  const ls=[...new Map(ents.map(e=>[e.l.id,e.l])).values()].sort((a,b)=>a.displayName.localeCompare(b.displayName,undefined,{numeric:true}));
  const hasBoth=ls.some(l=>l.type==='trolleybus')&&ls.some(l=>l.type==='bus');
  const via=new Map();ents.forEach(e=>e.d.stops.slice(e.i+1).forEach(x=>via.set(x.stationId,sname(x.stationId))));
  const viaList=[...via].sort((a,b)=>a[1].localeCompare(b[1]));
  fx.innerHTML=`<div class="chips">${ls.map(l=>`<button class="chip" data-l="${esc(l.id)}" style="--c:${esc(l.color||'#4d83ff')}">${esc(l.displayName)}</button>`).join('')}</div>
   <div class="advwrap"><button class="advbtn" id="ab"></button><button class="clr" id="cl">Clear</button><div id="mn"></div></div>`;
  const menu=()=>{const n=now(),d=hasBoth?'':'dis';
    return`<div class="menu">
    <h3>Vehicle</h3>${[['trolleybus','Trolleybus'],['bus','Bus']].map(([t,nm])=>`<label class="chk ${d}"><input type="checkbox" data-t="${t}" ${F.types.has(t)?'checked':''} ${hasBoth?'':'disabled'}>${nm}</label>`).join('')}
    <h3>Departure time</h3>
    <label class="chk"><input type="checkbox" id="ca" ${F.after!=null?'checked':''}>After<input type="time" id="ta" value="${fmt(F.after??n)}"></label>
    <label class="chk"><input type="checkbox" id="cb" ${F.before!=null?'checked':''}>Before<input type="time" id="tb" value="${fmt(F.before??Math.min(n+60,1439))}"></label>
    <h3>Stops at</h3>
    <label class="chk ${viaList.length?'':'dis'}"><input type="checkbox" id="cv" ${F.via?'checked':''}><button type="button" class="selbtn" id="sv">${F.viaSel?esc(sname(F.viaSel)):'Choose a station…'} ▾</button></label></div>`};
  const drawMenu=()=>$('#mn').innerHTML=F.open?menu():'';
  const sync=()=>{
    fx.querySelectorAll('.chip').forEach(c=>c.classList.toggle('off',F.sel.size>0&&!F.sel.has(c.dataset.l)));
    const k=advCount(),ab=$('#ab');ab.textContent='⚙ Advanced filters'+(k?' · '+k:'')+(F.open?' ▴':' ▾');
    ab.classList.toggle('on',k>0);$('#cl').hidden=!(k||F.sel.size)};
  refreshDeps=()=>{const n=now(),out=[];
    const A=F.after!=null?uw(F.after):null,B=F.before!=null?uw(F.before):null;
    [0,-1].forEach(o=>ents.forEach(e=>times(e.d,o).forEach((t,i)=>{   // o=-1: yesterday's trips still running past midnight
      let m=toMin(t)+e.off;if(o)m-=1440;
      if(m<n-PVMIN||(F.sel.size&&!F.sel.has(e.l.id))||(F.types.size&&!F.types.has(e.l.type))||!(A!=null&&B!=null&&A>B?(m>=A||m<=B):!((A!=null&&m<A)||(B!=null&&m>B)))||
        (F.via&&!e.d.stops.some((x,k)=>k>e.i&&x.stationId===F.via)))return;
      out.push({...e,m,ti:i,y:o?1:0})})));
    out.sort((a,b)=>a.m-b.m);
    const up=out.filter(e=>e.m>=n),pv=out.filter(e=>e.m<n).slice(-PV),pages=Math.max(1,Math.ceil(up.length/PG));
    F.page=Math.min(Math.max(F.page,0),pages-1);
    $('#pv').textContent=(F.prev?'Hide':'Show')+' previous departures '+(F.prev?'▴':'▾');
    $('#pdeps').innerHTML=F.prev?(pv.length?pv.map(e=>rowHtml(e,n,1)).join(''):'<div class="empty" style="padding:18px 20px">No departures in the past hour</div>'):'';
    deps.innerHTML=(up.length?up.slice(F.page*PG,F.page*PG+PG).map(e=>rowHtml(e,n)).join(''):`<div class="empty">${F.sel.size||advCount()?'No departures match these filters':'No upcoming departures'}</div>`)+
      (pages>1?`<div class="pager"><button data-pg="-1" ${F.page<1?'disabled':''} aria-label="Previous page">←</button><span>Page ${F.page+1} of ${pages}</span><button data-pg="1" ${F.page>=pages-1?'disabled':''} aria-label="Next page">→</button></div>`:'')};
  $('#pv').onclick=()=>{F.prev=!F.prev;refreshDeps()};
  deps.onclick=e=>{const b=e.target.closest('[data-pg]');if(!b||b.disabled)return;e.stopPropagation();F.page+=+b.dataset.pg;refreshDeps();main.scrollTop=0};
  const update=()=>{F.page=0;sync();refreshDeps()};
  closeFx=()=>{F.open=false;drawMenu();sync()};
  const openVia=()=>{
    document.querySelector('.vp')?.remove();
    const o=document.createElement('div');o.className='vp';
    o.innerHTML='<div class="vpb"><input type="text" placeholder="Search stations" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="vl"></div></div>';
    document.body.appendChild(o);
    const qi=o.querySelector('input'),vl=o.querySelector('.vl');
    const draw=()=>{const t=qi.value.trim().toLowerCase(),r=viaList.filter(([k,nm])=>!t||nm.toLowerCase().includes(t));
      vl.innerHTML=r.map(([k,nm])=>`<button data-k="${esc(k)}" class="${k===F.viaSel?'on':''}">${esc(nm)}</button>`).join('')||'<div class="empty">No stations match</div>'};
    qi.oninput=draw;draw();
    o.onclick=e=>{const b=e.target.closest('[data-k]');
      if(b){F.via=F.viaSel=b.dataset.k;F.sel.clear();o.remove();drawMenu();update()}
      else if(!e.target.closest('.vpb'))o.remove()};
    qi.focus();
  };
  fx.onclick=e=>{
    if(e.target.closest('#sv'))return openVia();
    const c=e.target.closest('.chip');
    if(c){clearAdv();const k=c.dataset.l;F.sel.has(k)?F.sel.delete(k):F.sel.add(k);F.open=false;drawMenu();return update()}
    if(e.target.closest('#ab')){F.open=!F.open;drawMenu();return sync()}
    if(e.target.closest('#cl')){F.sel.clear();clearAdv();F.open=false;drawMenu();update()}};
  fx.onchange=e=>{const t=e.target,g=x=>$('#'+x);
    if(t.dataset.t)t.checked?F.types.add(t.dataset.t):F.types.delete(t.dataset.t);
    else if(t.id==='ca'||t.id==='ta'){if(t.id==='ta'&&t.value)g('ca').checked=true;F.after=g('ca').checked?tm(g('ta').value)??0:null}
    else if(t.id==='cb'||t.id==='tb'){if(t.id==='tb'&&t.value)g('cb').checked=true;F.before=g('cb').checked?tm(g('tb').value)??1439:null}
    else if(t.id==='cv'){if(!t.checked)F.via=null;else if(F.viaSel)F.via=F.viaSel;else{t.checked=false;return openVia()}}
    else return;
    if(advCount())F.sel.clear();update()};
  drawMenu();sync();refreshDeps();
}
let mapObj=null;
async function initMap(){
  const el=$('#map');
  try{
    let meta=null,w,h;
    try{const r=await fetch('tiles/meta.json');if(r.ok)meta=await r.json()}catch(e){}
    if(meta){w=meta.w;h=meta.h}
    else{const im=new Image();im.src='map.png';await new Promise((ok,no)=>{im.onload=ok;im.onerror=no});w=im.naturalWidth;h=im.naturalHeight}   // fallback: single big image (slow)
    if(!el.isConnected)return;
    const b=L.latLngBounds([[-h,0],[0,w]]);
    mapObj=L.map(el,{crs:L.CRS.Simple,zoomSnap:.25,zoomDelta:.5,minZoom:-10,maxZoom:2,attributionControl:false,zoomControl:false,maxBoundsViscosity:.9,fadeAnimation:false,bounceAtZoomLimits:false});
    L.control.zoom({position:'bottomright'}).addTo(mapObj);
    if(meta){const N=meta.levels;
      new(L.TileLayer.extend({getTileUrl(c){return'tiles/'+(c.z+N)+'/'+c.x+'/'+c.y+'.png'}}))('',{tileSize:meta.tile,minZoom:-10,maxZoom:2,minNativeZoom:-N,maxNativeZoom:0,bounds:b,noWrap:true,keepBuffer:3}).addTo(mapObj)}
    else L.imageOverlay('map.png',b).addTo(mapObj);
    mapObj.fitBounds(b);
    mapObj.setMinZoom(mapObj.getZoom()-1);mapObj.setMaxBounds(b.pad(.3));
  }catch(e){el.innerHTML='<div class="mapmsg">Could not load the map.<br>Add tiles/ (or map.png) next to index.html.</div>'}
}
function render(s,keep){
  s=s||{v:'home'};if(mapObj){mapObj.remove();mapObj=null}refreshDeps=null;closeFx=null;document.querySelector('.vp')?.remove();if(!keep)pickOpen=false;main.classList.toggle('fill',s.v==='map');$('#dt').hidden=s.v==='map';const y=main.scrollTop,v=V[s.v](s);
  const ttl=$('#ttl');if(s.v==='home')ttl.innerHTML='<img src="OTP.png" alt="OTP" onerror="this.replaceWith(\'Transit\')">';else ttl.textContent=v.t;$('#bk').hidden=s.v==='home';
  $('#dt').textContent=({auto:'Auto · ',workday:'',holiday:''}[mode])+(dayType()==='workday'?'Workday':'Holiday');
  main.innerHTML=v.h;v.after&&v.after();main.scrollTop=keep?y:0;
}
main.addEventListener('click',e=>{
  if(!e.target.closest('.menu,#ab,[data-pk]')){   // tap outside an open dropdown closes it (scrolling outside still works)
    if(pickOpen){pickOpen=false;return render(history.state,true)}
    if(F.open&&closeFx)return closeFx()}
  if(e.target.closest('[data-pk]')){pickOpen=!pickOpen;return render(history.state,true)}
  const g=e.target.closest('[data-go]');if(g)return go(JSON.parse(g.dataset.go));
  const b=e.target.closest('[data-i]');if(b&&!b.disabled)set({...history.state,i:+b.dataset.i});
});
setInterval(()=>{const s=history.state||{v:'home'};if(s.v==='map'||(s.v==='trip'&&pickOpen))return;if(s.v==='station')refreshDeps&&refreshDeps();else if(s.v!=='search')render(s,true)},20000);
load().then(()=>{history.replaceState(history.state||{v:'home'},'');render(history.state)})
 .catch(()=>{main.innerHTML='<div class="empty">Could not load schedule data.<br>Serve this folder over http(s) instead of opening the file directly.<ul style="display:inline-block;text-align:left;margin:14px 0 0;padding-left:20px"><li>GitHub might be down</li><li>Check Internet connection</li><li>Check capitalization and/or name of new line files</li></ul></div>'});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
