<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Offline Transit</title>
<style>
:root{--bg:#0e1116;--card:#181d25;--card2:#222935;--tx:#e8ecf2;--mut:#8b95a5;--acc:#4d83ff;--ok:#3ecf8e;--line:#2a313d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden;overscroll-behavior:none;
 font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
header h1{flex:1;margin:0;font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:22px}
.pill{border:0;border-radius:20px;background:var(--card);color:var(--mut);font-size:13px;padding:8px 12px}
main{flex:1;overflow-y:auto;padding:4px 14px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit}
button:active,.row:active{filter:brightness(1.3);transform:scale(.985)}
.hero{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.big{display:flex;align-items:center;gap:16px;width:100%;padding:26px 20px;border:0;border-radius:22px;background:var(--card);text-align:left}
.big .ic{font-size:34px;width:64px;height:64px;border-radius:18px;background:var(--card2);display:grid;place-items:center}
.big b{display:block;font-size:20px}.big span{color:var(--mut);font-size:14px}
.clock{font-size:54px;font-weight:700;margin:14px 0 0;letter-spacing:-1px}.sub{color:var(--mut);margin-bottom:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.badge{display:inline-grid;place-items:center;min-width:46px;height:32px;padding:0 10px;border-radius:9px;font-weight:700;color:#fff;font-size:15px}
.grid .badge{height:56px;font-size:20px;border-radius:14px;border:0}
.row{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;border-radius:16px;background:var(--card);width:100%;border:0;text-align:left}
.row .grow{flex:1;min-width:0}.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}.row .s{color:var(--mut);font-size:13px}
.time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.eta{font-size:13px;color:var(--ok);text-align:right}
.code{color:var(--mut);font-size:12px;background:var(--card2);padding:3px 8px;border-radius:8px}
input{width:100%;padding:15px 16px;font-size:17px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);outline:0;-webkit-user-select:text;user-select:text;margin:6px 0 12px}
input:focus{border-color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.hd{background:var(--card);border-radius:22px;padding:18px;margin-top:6px;text-align:center}
.hd .big2{font-size:56px;font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0 2px}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;padding:14px;border:0;border-radius:14px;background:var(--card2);font-weight:600}
.nav button:disabled{opacity:.3}
.st{display:flex;gap:14px;padding:11px 4px;position:relative;align-items:center;border:0;background:none;width:100%;text-align:left}
.st .tm{width:52px;font-variant-numeric:tabular-nums;font-weight:600}
.st .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;z-index:1}
.st::before{content:"";position:absolute;left:66px;top:0;bottom:0;width:3px;margin-left:4.5px;background:var(--c);opacity:.5}
.st:first-child::before{top:50%}.st:last-child::before{bottom:50%}
.st.past{opacity:.38}.st .nm{flex:1}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
</style>
</head>
<body>
<div id="app"><header><button class="back" id="bk" hidden>‹</button><h1 id="ttl"></h1><button class="pill" id="dt"></button></header><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const now=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
let lines=[],stations={},by={},q='';
let mode='auto';try{mode=localStorage.dayMode||'auto'}catch(e){}
const dayType=()=>mode!=='auto'?mode:([0,6].includes(new Date().getDay())?'holiday':'workday');
const sname=id=>stations[id]?.displayName||id.replace(/([a-z])([A-Z])/g,'$1 $2');
const scode=id=>stations[id]?.ID||'';
const badge=l=>`<span class="badge" style="background:${esc(l.color||'#4d83ff')}">${esc(l.displayName||l.id)}</span>`;
const eta=d=>d<=0?'now':d<60?d+' min':Math.floor(d/60)+'h '+pad(d%60)+'m';
const times=d=>d.schedules[dayType()]||[];

async function load(){
  const man=await (await fetch('data/manifest.json')).json();
  stations=await (await fetch('data/'+man.stations)).json();
  lines=await Promise.all(man.lines.map(f=>fetch('data/lines/'+f).then(r=>r.json())));
  lines.forEach(l=>l.directions.forEach(d=>{let c=0;d.cum=d.stops.map(s=>{const v=c;c+=s.offsetMinutes;return v});
    d.stops.forEach((s,i)=>(by[s.stationId]??=[]).push({l,d,i,off:d.cum[i]}))}));
}
// ---- navigation (history-backed so the phone's back gesture works)
const go=s=>{history.pushState(s,'');render(s)};
const set=s=>{history.replaceState(s,'');render(s)};
window.onpopstate=e=>render(e.state||{v:'home'});
$('#bk').onclick=()=>history.back();
$('#dt').onclick=()=>{mode={auto:'workday',workday:'holiday',holiday:'auto'}[mode];try{localStorage.dayMode=mode}catch(e){}render(history.state||{v:'home'})};

const V={
home(){
  const d=new Date();
  return{t:'Transit',h:`<div class="clock">${fmt(now())}</div><div class="sub">${d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div>
  <div class="hero"><button class="big" data-go='{"v":"routes"}'><div class="ic">🚎</div><div><b>Search routes</b><span>Browse lines &amp; directions</span></div></button>
  <button class="big" data-go='{"v":"search"}'><div class="ic">📍</div><div><b>Search stations</b><span>By name or ID · upcoming departures</span></div></button></div>`}},
routes(){
  const g={};lines.forEach(l=>(g[l.type]??=[]).push(l));
  const nm={trolleybus:'Trolleybuses',bus:'Buses'};
  const order=['trolleybus','bus',...Object.keys(g).filter(k=>!nm[k])];
  return{t:'Routes',h:order.filter(k=>g[k]).map(k=>`<h2>${nm[k]||esc(k)}</h2><div class="grid">${g[k].map(l=>`<button class="badge" style="background:${esc(l.color)}" data-go='${JSON.stringify({v:'dirs',l:l.id})}'>${esc(l.displayName)}</button>`).join('')}</div>`).join('')||'<div class="empty">No routes found</div>'}},
dirs(s){
  const l=lines.find(x=>x.id===s.l);
  return{t:'Line '+l.displayName,h:`<h2>Choose direction</h2>`+l.directions.map(d=>`<button class="row" data-go='${JSON.stringify({v:'trip',l:l.id,d:d.id})}'>${badge(l)}<div class="grow"><div class="t">→ ${esc(sname(d.stops.at(-1).stationId))}</div><div class="s">from ${esc(sname(d.stops[0].stationId))} · ${d.stops.length} stops</div></div>›</button>`).join('')}},
trip(s){
  const l=lines.find(x=>x.id===s.l),d=l.directions.find(x=>x.id===s.d),ts=times(d),n=now();
  if(!ts.length)return{t:'Line '+l.displayName,h:`<div class="empty">No ${dayType()} departures for this direction</div>`};
  let i=s.i;
  if(i==null){i=ts.findIndex(t=>toMin(t)>=n);if(i<0)i=ts.length-1;history.replaceState({...s,i},'')}
  const dep=toMin(ts[i]),diff=dep-n,last=toMin(ts.at(-1))+d.cum.at(-1);
  const stat=diff>0?`Departs in ${eta(diff)}`:n>last?'Finished':diff===0?'Departing now':`Departed ${-diff} min ago`;
  const flag=i===ts.length-1&&diff<0?' · last of the day':'';
  return{t:'Line '+l.displayName,h:`<div class="hd">${badge(l)}<div class="sub" style="margin:6px 0 0">→ ${esc(sname(d.stops.at(-1).stationId))}</div>
  <div class="big2">${ts[i]}</div><div style="color:var(--ok);font-weight:600">${stat}${flag}</div>
  <div class="sub" style="margin:4px 0 0;font-size:13px">Departure ${i+1} of ${ts.length} · ${dayType()}</div>
  <div class="nav"><button data-i="${i-1}" ${i<1?'disabled':''}>‹ Previous</button><button data-i="${i+1}" ${i>=ts.length-1?'disabled':''}>Next ›</button></div></div>
  <h2>Stops</h2><div style="--c:${esc(l.color)}">${d.stops.map((st,k)=>{const m=dep+d.cum[k];
  return`<button class="st ${m<n?'past':''}" data-go='${JSON.stringify({v:'station',id:st.stationId})}'><span class="tm">${fmt(m)}</span><span class="dot"></span><span class="nm">${esc(sname(st.stationId))}${k===d.stops.length-1?'<span class="tag">end</span>':''}</span></button>`}).join('')}</div>`}},
search(){
  return{t:'Stations',h:`<input id="q" type="search" placeholder="Station name or ID" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(q)}"><div id="res"></div>`,after(){
    const inp=$('#q'),res=$('#res');
    const draw=()=>{q=inp.value;const t=q.trim().toLowerCase();
      let all=Object.entries(stations).map(([id,s])=>({id,name:s.displayName,code:s.ID}));
      Object.keys(by).forEach(id=>{if(!stations[id])all.push({id,name:sname(id),code:''})});
      if(t)all=all.filter(s=>s.name.toLowerCase().includes(t)||s.code===t||s.code.startsWith(t)||s.id.toLowerCase().includes(t));
      all.sort((a,b)=>(a.code===t?-1:b.code===t?1:0)||a.name.localeCompare(b.name));
      res.innerHTML=all.slice(0,60).map(s=>`<button class="row" data-go='${JSON.stringify({v:'station',id:s.id})}'><div class="grow"><div class="t">${esc(s.name)}</div><div class="s">${(by[s.id]||[]).length?[...new Set(by[s.id].map(e=>e.l.displayName))].join(' · '):'No lines'}</div></div>${s.code?`<span class="code">#${esc(s.code)}</span>`:''}</button>`).join('')||'<div class="empty">No stations match</div>'};
    inp.oninput=draw;draw();}}},
station(s){
  const n=now(),out=[];
  (by[s.id]||[]).forEach(e=>times(e.d).forEach((t,i)=>{const m=toMin(t)+e.off;if(m>=n)out.push({...e,m,ti:i})}));
  out.sort((a,b)=>a.m-b.m);
  const head=`<div class="sub" style="margin:4px 4px 0">${scode(s.id)?'Station #'+esc(scode(s.id))+' · ':''}${dayType()} schedule</div><h2>Upcoming departures</h2>`;
  return{t:sname(s.id),h:head+(out.length?out.slice(0,40).map(e=>{const term=e.i===e.d.stops.length-1;
   return`<button class="row" data-go='${JSON.stringify({v:'trip',l:e.l.id,d:e.d.id,i:e.ti})}'>${badge(e.l)}<div class="grow"><div class="t">→ ${esc(sname(e.d.stops.at(-1).stationId))}</div>${term?'<div class="s">Terminates here</div>':''}</div><div><div class="time">${fmt(e.m)}</div><div class="eta">${eta(e.m-n)}</div></div></button>`}).join(''):'<div class="empty">No upcoming departures</div>')}}
};
function render(s,keep){
  s=s||{v:'home'};const y=main.scrollTop,v=V[s.v](s);
  $('#ttl').textContent=v.t;$('#bk').hidden=s.v==='home';
  $('#dt').textContent=({auto:'Auto · ',workday:'',holiday:''}[mode])+(dayType()==='workday'?'Workday':'Holiday');
  main.innerHTML=v.h;v.after&&v.after();main.scrollTop=keep?y:0;
}
main.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(JSON.parse(g.dataset.go));
  const b=e.target.closest('[data-i]');if(b&&!b.disabled)set({...history.state,i:+b.dataset.i});
});
setInterval(()=>{const s=history.state||{v:'home'};if(s.v!=='search')render(s,true)},20000);
load().then(()=>{history.replaceState(history.state||{v:'home'},'');render(history.state)})
 .catch(()=>{main.innerHTML='<div class="empty">Could not load schedule data.<br>Serve this folder over http(s) instead of opening the file directly.</div>'});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
