<script>
const $=s=>document.querySelector(s),main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');

let lang='en',STR={};try{lang=localStorage.lang==='bg'?'bg':'en'}catch(e){}
const $t=(k,...a)=>{const v=(lang==='bg'&&STR[k])||k;return a.length?v.replace(/\{(\d+)\}/g,(m,i)=>a[i]??m):v},$h=(k,...a)=>esc($t(k,...a)),loc=()=>lang==='bg'?'bg':'en',sn=x=>String(x).toLowerCase().replace(/["„“№\-.,]/g,'').replace(/[а-яё]/g,c=>CYR[c]??c).replace(/shch/g,'sht').replace(/kh/g,'h').replace(/tz/g,'ts').replace(/[yj]/g,'i').replace(/w/g,'v').replace(/x/g,'ks').replace(/\s+/g,' ').trim();   // search normalisation: ignored symbols dropped, Cyrillic transliterated to Latin (streamlined system), spelling variants folded (y/j→i, kh→h, tz→ts…) on both the text and the query
const fmt=m=>{m=(m%1440+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const now=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
let lines=[],baseLines=[],stations={},by={},q='';const missing=new Set(),modMissing=new Set();
const norm=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,''),nmap={};
const fixId=r=>{r=String(r).trim();return stations[r]?r:nmap[norm(r)]||r};
let mode='auto';try{mode=localStorage.dayMode||'auto'}catch(e){}
let favs=new Set(),sortBy='id',onlyFav=false;   // favourite stations + station-search sort/filter, kept in localStorage
try{favs=new Set(JSON.parse(localStorage.favStations||'[]'));sortBy=localStorage.searchSort==='name'?'name':'id';onlyFav=localStorage.favOnly==='1'}catch(e){}
const saveFav=()=>{try{localStorage.favStations=JSON.stringify([...favs]);localStorage.searchSort=sortBy;localStorage.favOnly=onlyFav?'1':''}catch(e){}};
const dayType=(o=0)=>{if(mode!=='auto')return mode;const d=new Date();d.setDate(d.getDate()+o);return[0,6].includes(d.getDay())?'holiday':'workday'};
const sname=id=>(lang==='bg'&&stations[id]?.langBG)||stations[id]?.displayName||id.replace(/([a-z])([A-Z])/g,'$1 $2');
const ssm=id=>(lang==='bg'&&stations[id]?.smallTextBG)||stations[id]?.smallText||'';
const dnm=d=>(lang==='bg'&&d.displayNameBG)||d.displayName||'',dsm=d=>(lang==='bg'&&d.smallTextBG)||d.smallText||'';
const dlab=d=>{const ls=d.stops[d.term].stationId,nm=dnm(d)||sname(ls),sx=d.displayName?dsm(d):ssm(ls);return nmw(esc(nm),sx?esc(sx):'')};   // direction name + small text (inline if it fits, else next line)   // direction name / small text in the current language
const scode=id=>String(stations[id]?.number??'').trim();
// station match shared by the station search and the Stops at / Arrives from pickers: every word anywhere in name + small text (both languages), or number / id
// generic synonyms (data/aliases.json: {"groups":[["railway station","gara"],…]}): a query word equal to (or, from 3 letters, the start of) a group member also matches every other member
